# Dokploy currently builds this service with Nixpacks.
# Prisma 7 requires Node.js 20.19+, Node 22.12+, or Node 24+. The pinned
# Nix package currently supplies Node 22.11, so Node 24 is the compatible
# and deterministic choice for this application.
[phases.setup]
nixPkgs = ["nodejs_24", "npm-10_x", "openssl"]
